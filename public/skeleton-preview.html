<!DOCTYPE html>
<html lang="es" class="">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CES Legal · Skeleton de carga — preview</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:Inter,system-ui,sans-serif;background:#fafaf9;color:#1c1917;padding:24px;min-height:100vh}
  html.dark body{background:#0c0a09;color:#f5f5f4}
  .bar{display:flex;gap:8px;align-items:center;margin-bottom:22px;flex-wrap:wrap}
  .bar h1{font-family:'Space Grotesk';font-size:1.05rem;margin:0 12px 0 0;flex:1 0 100%}
  .bar button{font:inherit;font-size:.8rem;font-weight:600;border:1px solid rgba(0,0,0,.12);background:#fff;color:#1c1917;border-radius:.6rem;padding:.5rem .9rem;cursor:pointer}
  html.dark .bar button{background:rgba(255,255,255,.06);color:#f5f5f4;border-color:rgba(255,255,255,.14)}
  .bar button.on{background:linear-gradient(135deg,#e11d48,#f97316);color:#fff;border-color:transparent}

  /* ── Sistema de skeleton (idéntico al inyectado en el panel) ── */
  @keyframes ces-sk-shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
  .ces-sk{position:relative;overflow:hidden;background-color:#e7e5e4;border-radius:.5rem;
      background-image:linear-gradient(90deg,transparent 0%,rgba(225,29,72,.12) 45%,rgba(249,115,22,.16) 55%,transparent 100%);
      background-size:200% 100%;background-repeat:no-repeat;animation:ces-sk-shimmer 1.5s ease-in-out infinite}
  html.dark .ces-sk{background-color:rgba(255,255,255,.07);
      background-image:linear-gradient(90deg,transparent 0%,rgba(251,113,133,.14) 45%,rgba(249,115,22,.16) 55%,transparent 100%)}
  .ces-sk-line{height:.7rem;border-radius:.375rem}
  .ces-sk-line.sm{height:.5rem}
  .ces-sk-title{height:1.25rem;border-radius:.45rem}
  .ces-sk-btn{height:2.25rem;width:9rem;border-radius:.65rem}
  .ces-sk-circle{border-radius:50%}
  .ces-sk-card{border-radius:1rem;height:6.5rem}
  .ces-sk-w-25{width:25%}.ces-sk-w-30{width:30%}.ces-sk-w-40{width:40%}.ces-sk-w-55{width:55%}.ces-sk-w-70{width:70%}.ces-sk-w-85{width:85%}
  .ces-sk-stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:1rem;margin:0 0 1.5rem}
  .ces-sk-panel{border-radius:1rem;border:1px solid rgba(0,0,0,.06);padding:1.25rem 1.5rem;background:#fff}
  html.dark .ces-sk-panel{background:rgba(255,255,255,.02);border-color:rgba(255,255,255,.06)}
  .ces-sk-row{display:flex;gap:1rem;align-items:center;padding:.8rem 0;border-bottom:1px solid rgba(0,0,0,.05)}
  html.dark .ces-sk-row{border-color:rgba(255,255,255,.05)}
  .ces-sk-row:last-child{border-bottom:0}
  .ces-sk-hd{display:flex;align-items:center;justify-content:space-between;gap:1rem;margin-bottom:1.5rem}
  .ces-sk-hd-actions{display:flex;gap:.6rem;flex-shrink:0}
  .ces-sk-tb{display:flex;gap:.6rem;margin-bottom:1rem;align-items:center}
  .ces-sk-grid2{display:grid;grid-template-columns:1fr 1fr;gap:1.25rem}
  @media(max-width:720px){.ces-sk-grid2{grid-template-columns:1fr}}
  .ces-sk-input{height:2.6rem;border-radius:.6rem;margin-top:.5rem}
  .ces-sk-foot{display:flex;gap:.6rem;justify-content:flex-end;margin-top:1.5rem}
  .ces-sk-chart{height:16rem;border-radius:1rem}
  .ces-tsk-box{width:100%}
  .ces-tsk-row{display:flex;align-items:center;gap:1.25rem;padding:.85rem 1.25rem;border-bottom:1px solid rgba(0,0,0,.05)}
  html.dark .ces-tsk-row{border-color:rgba(255,255,255,.05)}
  .ces-tsk-row.head{padding-top:.6rem;padding-bottom:.6rem}
  .ces-tsk-row:last-child{border-bottom:0}
  .ces-ssk-grid{display:grid;gap:1.5rem}
  @media(min-width:768px){.ces-ssk-grid.c4{grid-template-columns:repeat(2,1fr)}}
  @media(min-width:1280px){.ces-ssk-grid.c4{grid-template-columns:repeat(4,1fr)}}
  .ces-ssk-card{border:1px solid rgba(0,0,0,.07);border-radius:.75rem;padding:1rem 1.25rem;background:#fff;display:flex;flex-direction:column;gap:.7rem}
  html.dark .ces-ssk-card{background:rgba(255,255,255,.02);border-color:rgba(255,255,255,.06)}
  .wrap{max-width:1100px;margin:0 auto}
</style>
</head>
<body>
  <div class="bar">
    <h1>Skeleton de carga — consciente del componente (tabla / formulario / dashboard)</h1>
    <button data-v="table" class="on" onclick="setV('table')">Lista / tabla</button>
    <button data-v="form" onclick="setV('form')">Formulario / wizard</button>
    <button data-v="dash" onclick="setV('dash')">Dashboard</button>
    <button data-v="tload" onclick="setV('tload')">Tabla deferLoading</button>
    <button data-v="stats" onclick="setV('stats')">Stats overview</button>
    <button onclick="document.documentElement.classList.toggle('dark')">Claro/oscuro</button>
  </div>
  <div class="wrap" id="page"></div>

<script>
  function sk(extra, style){ return '<div class="ces-sk ' + (extra||'') + '"' + (style?' style="'+style+'"':'') + '></div>'; }
  function header(withCreate){
      var a = withCreate ? sk('ces-sk-btn','width:6.5rem;height:2.1rem')+sk('ces-sk-btn','width:10rem;height:2.1rem')
                         : sk('ces-sk-btn','width:6rem;height:2.1rem');
      return '<div class="ces-sk-hd">'+sk('ces-sk-title ces-sk-w-30')+'<div class="ces-sk-hd-actions">'+a+'</div></div>';
  }
  function tableScaffold(){
      var s=header(true);
      s+='<div class="ces-sk-tb">'+sk('','flex:1;height:2.4rem;border-radius:.6rem')+sk('ces-sk-btn','width:6rem;height:2.4rem')+sk('ces-sk-btn','width:6rem;height:2.4rem')+'</div>';
      s+='<div class="ces-sk-panel"><div class="ces-sk-row">'+sk('ces-sk-line ces-sk-w-25')+sk('ces-sk-line ces-sk-w-25')+sk('ces-sk-line ces-sk-w-25')+sk('ces-sk-line','width:3rem;margin-left:auto')+'</div>';
      for(var i=0;i<8;i++){s+='<div class="ces-sk-row">'+sk('ces-sk-circle','width:2.1rem;height:2.1rem;flex:0 0 auto')+sk('ces-sk-line ces-sk-w-25')+sk('ces-sk-line ces-sk-w-25')+sk('ces-sk-line ces-sk-w-25')+sk('ces-sk-btn','width:4.5rem;height:1.8rem;margin-left:auto')+'</div>';}
      return s+'</div>';
  }
  function formScaffold(){
      var s=header(false)+'<div class="ces-sk-panel">'+sk('ces-sk-line ces-sk-w-25','height:1rem;margin-bottom:1.25rem')+'<div class="ces-sk-grid2">';
      for(var i=0;i<6;i++){s+='<div>'+sk('ces-sk-line ces-sk-w-40 sm')+sk('ces-sk-input')+'</div>';}
      s+='</div><div style="margin-top:1.25rem">'+sk('ces-sk-line ces-sk-w-25 sm')+sk('','height:6rem;border-radius:.6rem;margin-top:.5rem')+'</div></div>';
      s+='<div class="ces-sk-foot">'+sk('ces-sk-btn','width:6rem')+sk('ces-sk-btn','width:9rem')+'</div>';
      return s;
  }
  function dashScaffold(){
      var s=header(false)+'<div class="ces-sk-stats">';
      for(var i=0;i<4;i++){s+=sk('ces-sk-card');}
      return s+'</div><div class="ces-sk-grid2">'+sk('ces-sk-chart')+sk('ces-sk-chart')+'</div>';
  }
  // Skeleton real de tabla (reemplaza el spinner de deferLoading)
  function tloadScaffold(){
      var COLS=5;
      function row(head){
          var s='<div class="ces-tsk-row'+(head?' head':'')+'">';
          s+=sk('','flex:0 0 1.1rem;height:1.1rem;border-radius:.25rem');
          if(!head) s+=sk('','flex:0 0 2rem;height:2rem;border-radius:50%');
          for(var i=0;i<COLS;i++){var w=head?'5.5rem':(42+((i*19)%46))+'%';s+=sk('','flex:1;height:.7rem;border-radius:.375rem;max-width:'+(head?'5.5rem':w));}
          s+=sk('','flex:0 0 1.6rem;height:1.3rem;border-radius:.35rem');
          return s+'</div>';
      }
      var h='<div class="ces-sk-panel" style="padding:0"><div class="ces-tsk-box">'+row(true);
      for(var r=0;r<7;r++) h+=row(false);
      return h+'</div></div>';
  }
  // Skeleton de stats overview (placeholder del widget lazy)
  function statsScaffold(){
      var s='<div class="ces-ssk-grid c4">';
      for(var i=0;i<4;i++){s+='<div class="ces-ssk-card">'+sk('','height:.6rem;border-radius:.375rem;width:45%')+sk('','height:1.6rem;border-radius:.45rem;width:60%')+sk('','height:.55rem;border-radius:.375rem;width:80%')+'</div>';}
      return s+'</div>';
  }
  function setV(v){
      var html = v==='form'?formScaffold():v==='dash'?dashScaffold():v==='tload'?tloadScaffold():v==='stats'?statsScaffold():tableScaffold();
      document.getElementById('page').innerHTML = html;
      document.querySelectorAll('.bar button[data-v]').forEach(function(b){ b.classList.toggle('on', b.dataset.v===v); });
  }
  setV('tload');
</script>
</body>
</html>
